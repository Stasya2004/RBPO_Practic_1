name: Java CI with Maven and SAST

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # для ручного запуска

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    container:
      image: openjdk:22-ea-jdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Java version
        run: java -version

      - name: Make mvnw executable
        if: hashFiles('mvnw') != ''
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Upload artifacts (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  sast:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    needs: build           # запускается после успешной сборки
    continue-on-error: true   # чтобы пайплайн не ломался при находке уязвимостей

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep CI (SARIF)
        id: semgrep
        continue-on-error: true
        run: |
          mkdir -p test-results
          # Semgrep CI автоматически учитывает .gitignore, использует правила из Semgrep Registry
          semgrep ci \
            --sarif \
            --output test-results/semgrep.sarif \
            || true
        env:
          # Необязательно, но помогает при больших проектах
          SEMGREP_REPO_NAME: ${{ github.repository }}
          SEMGREP_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Ensure valid SARIF file (placeholder if scan failed or found nothing)
        run: |
          SARIF_FILE="test-results/semgrep.sarif"
          if [ ! -f "$SARIF_FILE" ] || [ ! -s "$SARIF_FILE" ]; then
            echo "⚠️ SARIF file missing or empty — creating valid placeholder"
            cat > "$SARIF_FILE" <<EOF
          {
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Semgrep",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF
          else
            echo "✅ SARIF file exists, size: $(wc -c < "$SARIF_FILE") bytes"
          fi
          # Копируем в корень для upload
          cp "$SARIF_FILE" semgrep.sarif

      - name: Upload SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        if: always()   # загружаем даже при ошибках в предыдущих шагах
